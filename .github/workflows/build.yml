name: Build hy2-android APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install cargo-ndk (prebuilt)
        id: ndk-prebuilt
        continue-on-error: true
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Install cargo-ndk (source fallback)
        if: steps.ndk-prebuilt.outcome != 'success'
        run: cargo install cargo-ndk

      - name: Verify cargo-ndk
        run: cargo ndk --version

      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        # sdkmanager 首次安装若不先接受 license 会直接失败，这是最常见的坑
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264"

      - name: Show NDK path (debug)
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls -d $ANDROID_HOME/ndk/* 2>/dev/null || true

      - name: Build Rust core for Android ABIs
        run: |
          cargo ndk \
            -t arm64-v8a \
            -t armeabi-v7a \
            -t x86_64 \
            -o app/src/main/jniLibs \
            --manifest-path core/Cargo.toml \
            build --release

      - name: Build APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hy2box-stage1-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
