name: Build hy2-android APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # 签名口令以 base64 常量内联：私钥本体仍只在 Secret 里，单独拿到口令无意义。
    # 只维护 1 个 Secret，避免手填 3 个口令漏填 / 带空格 / 值不一致导致 PKCS12 解密失败。
    env:
      HY2BOX_STORE_PASS_B64: aHkyYm94MjAyNg==
      HY2BOX_KEY_PASS_B64: aHkyYm94MjAyNg==
      HY2BOX_KEY_ALIAS: hy2box
      # 固定证书 SHA-256（去冒号小写），与 keytool 的 BA:AA:08:4D:...:3A:B1 是同一值。
      # 非机密，用于产物硬校验：指纹不符就让 CI 失败，不让人肉比对日志。
      HY2BOX_EXPECTED_SHA256: baaa084dbe860ba81332b89395ee406fb32d2405cb6947e49b25197960023ab1
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install cargo-ndk (prebuilt)
        id: ndk-prebuilt
        continue-on-error: true
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Install cargo-ndk (source fallback)
        if: steps.ndk-prebuilt.outcome != 'success'
        run: cargo install cargo-ndk

      - name: Verify cargo-ndk
        run: cargo ndk --version

      # ubuntu-latest runner 已预装完整 Android SDK 和多个 NDK，
      # 无需 android-actions/setup-android@v3（其内部 sdkmanager 常因 license/网络失败）
      - name: Inspect preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "--- platforms ---"
          ls "$ANDROID_HOME/platforms" || true
          echo "--- build-tools ---"
          ls "$ANDROID_HOME/build-tools" || true
          echo "--- ndk versions ---"
          ls "$ANDROID_HOME/ndk" || true
          # runner 已预设 ANDROID_NDK_ROOT，不要手动设 ANDROID_NDK_HOME，
          # 否则两者版本不一致会让 cargo-ndk 报警告
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT"

      - name: Build Rust core for Android ABIs
        # cargo ndk 不识别 --manifest-path，必须 cd 进 crate 目录再执行
        working-directory: core
        run: |
          cargo ndk \
            -t arm64-v8a \
            -t armeabi-v7a \
            -t x86_64 \
            -o ../app/src/main/jniLibs \
            build --release

      # 固定签名：只依赖 1 个 Secret（私钥 base64）；口令由 job 级常量解码后写入 GITHUB_ENV。
      # 缺 Secret 时直接 fail，避免悄悄退回随机 debug keystore 而用户以为已固定。
      - name: Decode fixed signing keystore (self-use only)
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::缺少 Secret SIGNING_KEYSTORE_BASE64，请在仓库 Settings -> Secrets and variables -> Actions 添加"
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/hy2box.keystore"
          ls -l "$RUNNER_TEMP/hy2box.keystore"
          STOREPASS=$(printf '%s' "$HY2BOX_STORE_PASS_B64" | base64 -d)
          KEYPASS=$(printf '%s' "$HY2BOX_KEY_PASS_B64" | base64 -d)
          keytool -list -v \
            -keystore "$RUNNER_TEMP/hy2box.keystore" \
            -storepass "$STOREPASS" \
            -alias "$HY2BOX_KEY_ALIAS"
          # 写入 GITHUB_ENV 后，后续所有步骤（含 Gradle）自动继承这些变量
          echo "HY2BOX_KEYSTORE=$RUNNER_TEMP/hy2box.keystore" >> "$GITHUB_ENV"
          echo "HY2BOX_STORE_PASSWORD=$STOREPASS" >> "$GITHUB_ENV"
          echo "HY2BOX_KEY_PASSWORD=$KEYPASS" >> "$GITHUB_ENV"
          echo "HY2BOX_KEY_ALIAS=$HY2BOX_KEY_ALIAS" >> "$GITHUB_ENV"

      # 防止「Decode 成功但 GITHUB_ENV 没传到 Gradle」导致静默回退到临时 debug keystore
      - name: Assert fixed signing env is active
        run: |
          if [ -z "$HY2BOX_KEYSTORE" ] || [ ! -f "$HY2BOX_KEYSTORE" ]; then
            echo "::error::固定签名环境变量未注入到 Gradle 步骤（HY2BOX_KEYSTORE=$HY2BOX_KEYSTORE）。请确认 Decode 步骤成功、且 workflow 已是 v1.9。"
            exit 1
          fi
          echo "keystore=$HY2BOX_KEYSTORE  alias=$HY2BOX_KEY_ALIAS"

      - name: Build APK (fixed signature)
        # 1) 网页上传不会保留 gradlew 的可执行位，用 bash 调用避免 Permission denied
        # 2) 继续用 assembleDebug，但显式指定 selfUse signingConfig；
        #    release 变体无签名配置会产出 unsigned APK（ColorOS 提示「安装包异常」）
        # 3) 签名参数已由上一步写入 GITHUB_ENV，这里无需再声明 env
        run: bash ./gradlew assembleDebug --no-daemon --stacktrace

      # 硬断言：指纹不符直接 fail。只打印不比对时，CI 全绿也可能是临时 debug 签名，
      # 那样每次构建证书都不同，覆盖安装必然提示签名冲突。
      - name: Verify APK signature fingerprint
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER=$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort | tail -n 1)
          echo "apksigner=$APKSIGNER"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::找不到 apksigner，请看 Inspect preinstalled Android SDK 步骤日志"
            exit 1
          fi
          EXPECTED="$HY2BOX_EXPECTED_SHA256"
          FAILED=0
          for apk in app/build/outputs/apk/debug/*.apk; do
            echo "== $apk =="
            OUT=$("$APKSIGNER" verify --print-certs "$apk" 2>&1 || true)
            echo "$OUT"
            GOT=$(printf '%s\n' "$OUT" \
              | grep -i 'SHA-256 digest' | head -n 1 \
              | sed 's/^.*digest: *//' | tr -d ' :' | tr 'A-Z' 'a-z' || true)
            echo "expected=$EXPECTED"
            echo "actual  =$GOT"
            if [ "$GOT" != "$EXPECTED" ]; then
              echo "::error::$apk 不是固定证书签名（很可能回退到 runner 临时 debug keystore），本次 APK 不要拿去覆盖安装"
              FAILED=1
            fi
          done
          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi
          echo "全部 APK 指纹匹配，固定签名已生效"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hy2box-fixed-signed-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
