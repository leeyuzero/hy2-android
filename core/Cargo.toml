[package]
name = "hy2core"
version = "0.1.0"
edition = "2021"

[lib]
name = "hy2core"
crate-type = ["cdylib"]

[dependencies]
rsteria2 = "0.1"
tokio = { version = "1", features = ["full"] }
jni = "0.21"
log = "0.4"
android_logger = "0.15"
libc = "0.2"
smoltcp = { version = "0.14", default-features = false, features = ["std", "alloc", "medium-ip", "proto-ipv4", "socket-tcp", "log"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
