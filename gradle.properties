# AndroidX：AGP 8.x 使用 AndroidX 依赖（Compose / activity / core-ktx）时必需，缺失会构建失败
android.useAndroidX=true

# 不启用 Android Support 库兼容层（新项目不需要）
android.enableJetifier=false

# Gradle 守护进程与并行构建，加快 CI 速度
org.gradle.daemon=true
org.gradle.parallel=true

# CI runner 内存有限，给 Gradle JVM 分配 2GB
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Kotlin 官方风格：不要用 kapt 增量（本项目未用 kapt，保留默认即可）
kotlin.code.style=official
